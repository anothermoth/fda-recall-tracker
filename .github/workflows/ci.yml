name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Install, lint, typecheck, test, synth, and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fda
          POSTGRES_PASSWORD: fda
          POSTGRES_DB: fda_recalls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fda -d fda_recalls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fda:fda@localhost:5432/fda_recalls
      DATABASE_READONLY_URL: postgres://fda_app_readonly:fda_app_readonly@localhost:5432/fda_recalls
      CDK_DEFAULT_ACCOUNT: "000000000000"
      CDK_DEFAULT_REGION: us-east-1
      DATABASE_SECRET_ARN: arn:aws:secretsmanager:us-east-1:000000000000:secret:fda-recall-tracker/database-url-AbCdEf

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run database migrations
        run: npm run migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Synthesize CDK
        run: npm run synth
